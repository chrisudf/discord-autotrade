[project]
name = "autotrade"
version = "0.1.0"
description = "Discord 信号跟单 → moomoo 期权自动下单(discord-copytrade 的架构重构版)"
requires-python = ">=3.11"

[project.scripts]
autotrade = "autotrade.app.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autotrade*"]
